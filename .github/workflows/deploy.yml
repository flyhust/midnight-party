# 推到 main 之后，通知 VPS 上的 Coolify 重新部署 midnight.victoraaa.tech
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里加两个 secret：
#   COOLIFY_WEBHOOK：Coolify 应用页面 → Webhooks → Deploy Webhook 的网址
#   COOLIFY_TOKEN：Coolify → Keys & Tokens → API tokens 新建的 token（勾选 deploy 权限）
name: 部署到 Coolify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 通知 Coolify 部署
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::warning::还没设置 COOLIFY_WEBHOOK / COOLIFY_TOKEN，跳过部署"
            exit 0
          fi
          # 只印出网址的路径（不含主机和参数），方便排查填错了哪种网址
          echo "webhook path: $(echo "$COOLIFY_WEBHOOK" | sed -E 's#^[a-z]+://[^/]+##; s#\?.*##')"
          code=$(curl -sS -o resp.txt -w '%{http_code}' -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
          echo "GET -> $code"; head -c 300 resp.txt; echo
          if [ "$code" = 405 ]; then
            code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
            echo "POST -> $code"; head -c 300 resp.txt; echo
          fi
          case "$code" in 2*) echo "Coolify 已开始部署" ;; *) echo "::error::Coolify 返回 $code"; exit 1 ;; esac
