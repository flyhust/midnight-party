<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script>window.MP_SERVER=true</script></head><body><title>暗夜派对</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：1920 年代豪宅夜宴。四角四个房间，中间横贯控制室；左侧宾客名单，右侧私人手牌与推理笔记 */
:root {
  color-scheme: dark;
  --bg: #120c1a; --bg2: #1a1225; --panel: #21172e; --panel2: #2a1e3a; --line: #3d2d50;
  --gold: #d9b56a; --gold-hi: #f3dca0; --ink: #efe6d6; --mute: #a596b6; --wine: #5a1626;
  --z-red: #d04556; --z-blue: #4a86d8; --z-green: #3fa070; --z-purple: #9562d0; --z-yellow: #e6b43c; --z-black: #0b090e;
  --danger: #ff5a6a; --ok: #6fdc9a;
  --f-display: 'Limelight', 'Noto Serif SC', Georgia, serif;
  --f-title: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
  --f-body: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --tok: 58px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--f-body); overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.screen { min-height: 100%; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.btn { border: 1px solid var(--gold); background: linear-gradient(#2c2038, #1d1428); color: var(--gold-hi); padding: 10px 18px; border-radius: 3px; letter-spacing: .08em; font-weight: 700; transition: transform .12s, background .2s, box-shadow .2s; }
.btn:hover:not(:disabled) { background: linear-gradient(#3a2a4a, #261a34); box-shadow: 0 0 18px rgba(217,181,106,.25); }
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
.btn.primary { background: linear-gradient(#e7c67c, #b8913f); color: #21140a; border-color: #f3dca0; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(#f3d692, #c9a24f); }
.btn.danger { border-color: var(--danger); color: #ffd4d8; background: linear-gradient(#4a1a24, #2a0f16); }
.btn.ghost { border-color: var(--line); color: var(--mute); background: transparent; font-weight: 500; }
.btn:disabled { opacity: .38; cursor: not-allowed; filter: grayscale(.6); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.deco-rule { height: 12px; background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent) center/100% 1px no-repeat; position: relative; }
.deco-rule::after { content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; background: var(--gold); transform: translate(-50%, -50%) rotate(45deg); }
.h-title { font-family: var(--f-title); font-weight: 900; letter-spacing: .12em; text-wrap: balance; }
.eyebrow { font-size: 11px; letter-spacing: .28em; color: var(--gold); text-transform: uppercase; }

/* ---------- 雨夜背景 ---------- */
#scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; transition: opacity .8s, filter .8s; }
#scene[data-mode="dim"] { opacity: .32; filter: saturate(.7) blur(1px); }
#scene .scene-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#scene .rain { position: absolute; inset: 0; }
#scene .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(5,3,9,.75) 100%); }
#scene .flash { position: absolute; inset: 0; background: #dfe6ff; opacity: 0; mix-blend-mode: screen; }
#scene .flash.go { animation: bolt 1.1s ease-out; }
@keyframes bolt { 0% { opacity: 0 } 4% { opacity: .55 } 9% { opacity: .08 } 14% { opacity: .4 } 40% { opacity: .05 } 100% { opacity: 0 } }
#scene .flick { animation: flick 6s infinite steps(1); }
@keyframes flick { 0%, 100% { opacity: 1 } 47% { opacity: .35 } 49% { opacity: 1 } 73% { opacity: .55 } 74% { opacity: 1 } }
#scene .dancer { animation: sway 1.4s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-9deg) } to { transform: rotate(9deg) } }
#scene .sl { transform-box: view-box; animation: sweep 9s ease-in-out infinite alternate; }
#scene .sl.a { transform-origin: 600px 700px; }
#scene .sl.b { transform-origin: 1000px 700px; animation-duration: 11s; animation-direction: alternate-reverse; }
@keyframes sweep { from { transform: rotate(-24deg) } to { transform: rotate(22deg) } }
#scene .clouds { animation: drift 60s linear infinite alternate; }
@keyframes drift { to { transform: translateX(-120px) } }
#scene .beacon { animation: beacon 1.6s infinite; }
@keyframes beacon { 50% { opacity: .2 } }
#scene .halo { animation: halo 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
@keyframes halo { to { transform: scale(1.12); opacity: .7 } }
#app, .toasts, .banner { position: relative; z-index: 1; }
.toasts { position: fixed; }
.banner { position: fixed; }

/* ---------- 标题页 ---------- */
#title { display: grid; place-items: center; text-align: center; }
.marquee { border: 2px solid var(--gold); padding: 34px 28px 30px; position: relative; max-width: 560px; width: 100%; background: linear-gradient(180deg, rgba(60,14,28,.72), rgba(14,9,22,.86)); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: 0 30px 90px rgba(0,0,0,.6); }
.marquee::before, .marquee::after { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(217,181,106,.45); pointer-events: none; }
.marquee::after { inset: -10px; border: 1px dashed rgba(217,181,106,.25); }
.neon { font-family: var(--f-display); font-size: clamp(34px, 9vw, 64px); line-height: 1; color: #ffe9b8; letter-spacing: .04em;
  text-shadow: 0 0 6px #ffcf6b, 0 0 18px #ff9f3c, 0 0 42px #ff6a3c; animation: neon 4s infinite; }
@keyframes neon { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1 } 20%, 63% { opacity: .35 } }
.title-cn { font-family: var(--f-title); font-weight: 900; font-size: clamp(30px, 8vw, 52px); letter-spacing: .4em; margin: 14px 0 6px; padding-left: .4em; color: var(--gold-hi); }
.tagline { color: var(--mute); max-width: 36ch; margin: 0 auto 26px; }
/* 宾客流动：两排反向循环，边缘渐隐 */
.cast-flow { display: grid; gap: 10px; margin: 6px -28px 24px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
.cast-row { overflow: hidden; padding-block: 6px; }
.cast-track { display: flex; gap: 14px; width: max-content; animation: flow 38s linear infinite reverse; }
.cast-row.rev .cast-track { animation-direction: normal; animation-duration: 46s; }
.cast-flow.paused .cast-track { animation-play-state: paused; }
.cast-flow .mini { cursor: pointer; outline: none; }
.cast-flow.paused .mini:not(:hover):not(:focus) .mini-in { filter: brightness(.55) saturate(.6); }
.cast-pop { position: fixed; z-index: 80; width: 260px; display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; padding: 12px 14px; background: linear-gradient(170deg, #fbf3df, #e9dcbc); color: #2a1a12; border: 2px solid var(--gold); border-radius: 6px; box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 0 4px rgba(217,181,106,.18); pointer-events: none; transform-origin: var(--ax, 50%) 100%; animation: cpIn .32s cubic-bezier(.2,.9,.3,1.2); }
.cast-pop.below { transform-origin: var(--ax, 50%) 0; }
.cast-pop::after { content: ""; position: absolute; left: calc(var(--ax, 50%) - 7px); bottom: -8px; width: 12px; height: 12px; background: #e9dcbc; border-right: 2px solid var(--gold); border-bottom: 2px solid var(--gold); transform: rotate(45deg); }
.cast-pop.below::after { top: -8px; bottom: auto; transform: rotate(225deg); background: #fbf3df; }
.cast-pop.out { animation: cpOut .18s ease-in forwards; }
@keyframes cpIn { from { opacity: 0; transform: perspective(600px) rotateY(80deg) scale(.9); } }
@keyframes cpOut { to { opacity: 0; transform: perspective(600px) rotateY(-60deg) scale(.95); } }
.cast-pop .cp-pic { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 40%, #fff6e0, #d9c69a); border: 2px solid #b89a5a; }
.cast-pop .cp-txt { display: grid; gap: 2px; min-width: 0; text-align: left; }
.cast-pop .eyebrow { color: #8a6a2a; font-size: 9.5px; letter-spacing: .2em; }
.cast-pop .cp-nm { font-family: var(--f-title); font-weight: 900; font-size: 22px; letter-spacing: .2em; }
.cast-pop .cp-bio { font-size: 13px; color: #4a3424; line-height: 1.45; }
.cast-pop .cp-hint { font-size: 11px; color: #9a3a2a; margin-top: 2px; font-style: italic; }
@keyframes flow { to { transform: translateX(calc(-50% - 7px)); } }
.cast-flow .mini { display: grid; justify-items: center; gap: 3px; animation: bob 3s ease-in-out infinite; animation-delay: var(--d); }
.cast-flow .mini-in { width: 54px; height: 54px; border-radius: 50%; overflow: hidden; border: 1.5px solid var(--gold); background: radial-gradient(circle at 50% 35%, #463559, #1b1326); box-shadow: 0 0 0 3px rgba(217,181,106,.08), 0 6px 14px rgba(0,0,0,.45); transition: transform .25s cubic-bezier(.3,1.6,.5,1), box-shadow .25s; }
.cast-flow .mini:hover .mini-in { transform: scale(1.22) rotate(-4deg); box-shadow: 0 0 0 3px var(--gold-hi), 0 0 22px rgba(255,190,90,.55); }
.cast-flow .mini span { font-size: 10.5px; color: var(--mute); letter-spacing: .1em; }
.cast-flow .mini:hover span { color: var(--gold-hi); }
@keyframes bob { 50% { transform: translateY(-5px) } }

/* ---------- 设置页 ---------- */
#setup { display: grid; place-items: center; }
.setup-card { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); padding: 24px; display: grid; gap: 22px; }
.field { display: grid; gap: 10px; }
.field label { font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-width: 44px; padding: 8px 12px; border: 1px solid var(--line); background: var(--bg2); border-radius: 3px; }
.chip[aria-pressed="true"] { border-color: var(--gold); background: #3a2a1a; color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold); }
.hint { color: var(--mute); font-size: 12.5px; }
.setup-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; }

/* ---------- 抽身份 ---------- */
#draw { display: grid; align-content: start; justify-items: center; gap: 16px; text-align: center; }
.deck { display: grid; grid-template-columns: repeat(10, minmax(0, 64px)); gap: 8px; width: 100%; max-width: 720px; justify-content: center; }
@media (max-width: 620px) { .deck { grid-template-columns: repeat(5, minmax(0, 60px)); } }
.deck .dcard { aspect-ratio: 5/7; width: 100%; border: 0; padding: 0; background: none; transition: transform .25s, opacity .4s, filter .3s; border-radius: 4px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
.deck .dcard:hover:not(:disabled) { transform: translateY(-8px) rotate(-2deg); box-shadow: 0 10px 22px rgba(217,181,106,.25); }
.deck .dcard.taken { opacity: .12; pointer-events: none; }
.deck.shuffling .dcard { animation: shuf .5s ease-in-out; }
@keyframes shuf { 30% { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)); } }
.cb { display: block; width: 100%; height: 100%; }

/* ---------- 卡片翻转（全游戏统一） ---------- */
.flip { perspective: 1000px; }
.flip .inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .65s cubic-bezier(.2,.8,.2,1.15); }
.flip.flipped .inner { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 8px; overflow: hidden; }
.flip .face.front { transform: rotateY(180deg); }
.idcard { background: linear-gradient(170deg, #fbf3df, #e9dcbc); color: #2a1a12; border: 3px solid var(--gold); display: grid; grid-template-rows: auto 1fr auto; text-align: center; padding: 8px; }
.idcard .pic { border-radius: 4px; background: radial-gradient(circle at 50% 40%, #fff6e0, #d9c69a); border: 1px solid #b89a5a; overflow: hidden; aspect-ratio: 1; }
.idcard .nm { font-family: var(--f-title); font-weight: 900; font-size: 1.35em; letter-spacing: .2em; padding-left: .2em; margin-top: 4px; }
.idcard .bio { font-size: .78em; color: #6a5440; }
.stamp { position: absolute; left: 50%; top: 66%; transform: translate(-50%, -50%) rotate(-14deg) scale(2.2); opacity: 0; padding: 4px 12px; border: 4px solid currentColor; font-family: var(--f-title); font-weight: 900; font-size: 26px; letter-spacing: .15em; background: rgba(255,255,255,.75); border-radius: 4px; white-space: nowrap; transition: transform .25s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
.stamp.show { opacity: 1; transform: translate(-50%, -50%) rotate(-14deg) scale(1); }
.stamp.npc { color: #6b6b6b; } .stamp.player { color: #c0182e; } .stamp.right { color: #118a47; } .stamp.wrong { color: #c0182e; }

/* ---------- 游戏主界面 ---------- */
#game { display: grid; gap: 12px; grid-template-columns: 210px minmax(0, 1fr) 270px; grid-template-rows: auto 1fr; grid-template-areas: "top top top" "left board right"; align-items: start; }
.topbar { grid-area: top; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.brand { font-family: var(--f-display); color: var(--gold-hi); font-size: 20px; letter-spacing: .04em; margin-right: auto; text-shadow: 0 0 10px rgba(255,160,60,.5); }
.clock { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 30px; font-variant-numeric: tabular-nums; }
.clock.mid { border-color: var(--danger); color: #ffd4d8; box-shadow: 0 0 14px rgba(255,90,106,.35); }
.iconbtn { border: 1px solid var(--line); background: var(--bg2); border-radius: 3px; padding: 6px 10px; font-size: 13px; }
.iconbtn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); }
.left { grid-area: left; display: grid; gap: 8px; }
.right { grid-area: right; display: grid; gap: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); padding: 12px; }
.panel h3 { margin: 0 0 8px; font-family: var(--f-title); font-size: 15px; letter-spacing: .15em; color: var(--gold-hi); display: flex; justify-content: space-between; align-items: center; }
.plist { display: grid; gap: 6px; }
.pl { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; padding: 7px 8px; border: 1px solid transparent; border-radius: 3px; background: var(--bg2); transition: border-color .2s, box-shadow .2s; }
.pl .dot { width: 12px; height: 12px; border-radius: 50%; }
.pl .nm { font-weight: 700; }
.pl .sub { font-size: 11.5px; color: var(--mute); }
.pl.cur { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(217,181,106,.25); }
.pl.out { opacity: .45; text-decoration: line-through; }
.coins { display: flex; gap: 3px; }
.coin { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff2c0, #d9b56a 55%, #8a6a2a); box-shadow: 0 0 0 1px #6a4f1c; }
.coin.used { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

.board-wrap { grid-area: board; display: grid; gap: 10px; min-width: 0; }
.board { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; grid-template-areas: "z0 z1" "z4 z4" "z2 z3"; position: relative; }
.zone { --zc: var(--z-red); position: relative; min-height: 150px; border: 1px solid color-mix(in srgb, var(--zc) 55%, var(--line)); background:
  linear-gradient(160deg, color-mix(in srgb, var(--zc) 22%, transparent), transparent 70%), var(--panel); padding: 10px 10px 12px; transition: box-shadow .3s, border-color .3s; overflow: hidden; }
.zone::before { content: ""; position: absolute; inset: 5px; border: 1px solid color-mix(in srgb, var(--zc) 35%, transparent); pointer-events: none; }
.zone .zh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; position: relative; }
.zone .zh .sw { width: 12px; height: 12px; background: var(--zc); transform: rotate(45deg); align-self: center; }
.zone .zh b { font-family: var(--f-title); letter-spacing: .2em; font-size: 15px; }
.zone .zh span { color: var(--mute); font-size: 12px; }
.zone .zh .cnt { margin-left: auto; font-variant-numeric: tabular-nums; }
.zone .glyph { position: absolute; right: 8px; bottom: 4px; width: 70px; opacity: .12; pointer-events: none; }
.zone .toks { display: flex; flex-wrap: wrap; gap: 8px 6px; position: relative; min-height: calc(var(--tok) + 18px); }
.zone.z4 { --zc: var(--z-yellow); background: repeating-linear-gradient(0deg, rgba(230,180,60,.05) 0 2px, transparent 2px 4px), linear-gradient(160deg, rgba(230,180,60,.18), transparent 70%), var(--panel); }
.zone.z0 { --zc: var(--z-red); grid-area: z0; } .zone.z1 { --zc: var(--z-blue); grid-area: z1; } .zone.z2 { --zc: var(--z-green); grid-area: z2; } .zone.z3 { --zc: var(--z-purple); grid-area: z3; } .zone.z4 { grid-area: z4; min-height: 120px; }
.zone.flash { box-shadow: 0 0 0 2px var(--zc), 0 0 30px var(--zc); }
.zone.pickable { cursor: pointer; box-shadow: 0 0 0 2px var(--zc); animation: pulse 1.2s infinite; }

.tok { width: var(--tok); display: grid; justify-items: center; gap: 2px; border: 0; background: none; padding: 0; position: relative; transition: opacity .25s, filter .25s; }
.tok .ring { width: var(--tok); height: var(--tok); border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 35%, #463559, #1b1326); border: 2px solid #5a4870; position: relative; }
.tok .pt { width: 100%; height: 100%; display: block; }
.tok .lb { font-size: 11.5px; line-height: 1.2; white-space: nowrap; }
.tok.mine .ring { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(217,181,106,.35), 0 0 12px rgba(217,181,106,.5); }
.tok.mine .lb { color: var(--gold-hi); font-weight: 700; }
.tok .you { position: absolute; top: -4px; left: -4px; background: var(--gold); color: #21140a; font-size: 10px; font-weight: 700; padding: 0 4px; border-radius: 2px; }
.tok .tag { position: absolute; top: -2px; right: 2px; width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--bg); }
.tok .know { position: absolute; bottom: 14px; right: -4px; font-size: 9.5px; padding: 0 3px; border-radius: 2px; font-weight: 700; }
.tok .know.npc { background: #5d5a66; color: #fff; } .tok .know.pl { background: #c0182e; color: #fff; }
.tok.dead { filter: grayscale(1) brightness(.55); opacity: .55; }
.tok.dead .ring::after { content: ""; position: absolute; inset: 0; background: linear-gradient(45deg, transparent 46%, #c0182e 46% 54%, transparent 54%), linear-gradient(-45deg, transparent 46%, #c0182e 46% 54%, transparent 54%); }
.board.selecting .tok:not(.eligible) { opacity: .25; filter: grayscale(.8); pointer-events: none; }
.tok.eligible .ring { border-color: var(--gold-hi); animation: glow 1s ease-in-out infinite alternate; }
.tok.eligible { cursor: pointer; animation: hop 1.2s ease-in-out infinite; }
.tok.eligible:hover .ring { transform: scale(1.08); }
@keyframes glow { to { box-shadow: 0 0 0 3px var(--gold-hi), 0 0 18px var(--gold); } }
@keyframes hop { 50% { transform: translateY(-3px); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 3px var(--zc), 0 0 24px var(--zc); } }
.tok .slash { position: absolute; left: -10px; right: -10px; top: 50%; height: 4px; background: linear-gradient(90deg, transparent, #fff, #ff5a6a, transparent); transform: rotate(-35deg) scaleX(0); transform-origin: left; animation: slash .28s ease-out forwards; z-index: 3; }
@keyframes slash { to { transform: rotate(-35deg) scaleX(1); opacity: 0; } }

.promptbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 12px; border: 1px solid var(--gold); background: #2c1f17; color: var(--gold-hi); font-weight: 700; animation: drop .3s ease-out; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } }
.actionbar { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; padding: 12px; background: var(--panel); border: 1px solid var(--line); position: sticky; bottom: 0; z-index: 5; }
.actionbar .status { flex: 1 1 180px; display: grid; align-content: center; min-width: 0; }
.actionbar .status b { font-family: var(--f-title); letter-spacing: .1em; }
.actionbar .big { padding: 12px 22px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.why { font-size: 11.5px; color: var(--mute); }

.idhand { display: flex; gap: 10px; }
.idhand .flip { width: 100px; height: 140px; cursor: pointer; }
.idhand .flip .face { font-size: 11px; }
.nb-row { display: grid; gap: 4px; padding: 8px 0; border-top: 1px dashed var(--line); }
.nb-row:first-of-type { border-top: 0; }
.nb-head { display: flex; align-items: center; gap: 6px; font-weight: 700; }
.nb-sus { display: flex; flex-wrap: wrap; gap: 4px; }
.sus { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px 1px 2px; border-radius: 20px; background: var(--bg2); border: 1px solid var(--line); font-size: 11.5px; cursor: pointer; }

<script>
// ===== 暗夜派对 · 规则引擎 + AI（纯逻辑，无 UI）=====
const Engine = (() => {
  const ZONES = [
    { k: 'red', c: '红', n: '舞厅' },
    { k: 'blue', c: '蓝', n: '泳池' },
    { k: 'green', c: '绿', n: '温室' },
    { k: 'purple', c: '紫', n: '书房' },
    { k: 'yellow', c: '黄', n: '控制室' },
  ];
  const CONTROL = 4;
  const FACES = ['red', 'blue', 'green', 'purple', 'yellow', 'black'];
  const CONFIG = { tokens: 1, midnightRound: 20, maxRound: 50, escape: true };
  const CHARS = [
    ['厨师', '据说他的汤能让人说真话。'],
    ['医生', '总在观察别人的脸色。'],
    ['歌手', '今晚的主角，至少她这么认为。'],
    ['魔术师', '最擅长让东西消失。'],
    ['管家', '知道这栋房子的每一条暗道。'],
    ['诗人', '把每个人都写进了诗里。'],
    ['修女', '为所有人祈祷，包括凶手。'],
    ['作家', '正在写一本谋杀小说。'],
    ['园丁', '花园里的每一株毒草他都认识。'],
    ['记者', '在找今晚的头条。'],
    ['女伯爵', '这场派对的主人。'],
    ['船长', '见过比这更大的风浪。'],
    ['画家', '画的肖像总是少一个人。'],
    ['舞者', '一刻也停不下来。'],
    ['调酒师', '记得每个人点了什么。'],
    ['将军', '退役了，习惯没退。'],
    ['小丑', '笑得最大声的那个。'],
    ['富商', '欠了在场一半人的钱。'],
    ['钢琴师', '音乐一停，就有人倒下。'],
    ['拳击手', '鼻子断过三次。'],
  ];
  const AI_NAMES = ['狐狸', '乌鸦', '黑猫', '毒蛇', '猫头鹰', '蝙蝠', '孤狼', '蜘蛛'];
  const P_COLORS = ['#f2c96d', '#ff8a5c', '#5fd3c4', '#f06bb0', '#b9e35a', '#8ab4ff', '#c49bff', '#e8e2f2'];

  function mulberry(seed) {
    let a = seed >>> 0;
    return () => {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const shuffle = (r, a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = (r, a) => a[Math.floor(r() * a.length)];

  function newGame({ players = 4, human = 0, difficulty = 'normal', seed = Date.now() } = {}) {
    const r = mulberry(seed);
    const per = players <= 3 ? 2 : 1;
    const zoneOrder = shuffle(r, [...Array(20).keys()]);
    const chars = CHARS.map(([name, bio], i) => ({ id: i, name, bio, zone: 0, alive: true, owner: -1 }));
    zoneOrder.forEach((cid, i) => (chars[cid].zone = i % 5));
    const deck = shuffle(r, [...Array(20).keys()]);
    const ps = [];
    let ai = 0;
    for (let i = 0; i < players; i++) {
      const isH = i === human;
      ps.push({ id: i, name: isH ? '你' : AI_NAMES[ai++], human: isH, color: isH ? P_COLORS[0] : P_COLORS[ai], ids: [], tokens: CONFIG.tokens, out: false, diff: difficulty, exposedRound: -9 });
    }
    for (let k = 0; k < per; k++) for (const p of ps) { const c = deck.pop(); p.ids.push(c); chars[c].owner = p.id; }
    // 知识：know[o][c] = null 未知 / -1 NPC / -2 某个玩家 / q 属于玩家 q
    const know = ps.map(p => { const k = Array(20).fill(null); p.ids.forEach(c => (k[c] = p.id)); return k; });
    const cand = ps.map(o => ps.map(q => new Set(q.id === o.id ? [] : [...Array(20).keys()].filter(c => !o.ids.includes(c)))));
    const w = ps.map(() => ps.map(() => Array(20).fill(1)));
    const start = Math.floor(r() * players);
    return { r, seed, per, chars, players: ps, know, cand, w, cur: start, start, round: 1, over: false, winner: null, log: [], turns: 0 };
  }

  // ---------- 查询 ----------
  const alivePlayers = G => G.players.filter(p => !p.out);
  const ownAlive = (G, p) => G.players[p].ids.filter(c => G.chars[c].alive);
  const isMidnight = G => G.round >= CONFIG.midnightRound;
  const effFace = (G, f) => (f === 'yellow' && isMidnight(G) ? 'black' : f);
  const movableTo = (G, z) => G.chars.filter(c => c.alive && c.zone !== z).map(c => c.id);
  const ownZones = (G, p) => [...new Set(ownAlive(G, p).map(c => G.chars[c].zone))];
  function killTargets(G, p) {
    const zs = ownZones(G, p), mine = G.players[p].ids;
    return G.chars.filter(c => c.alive && zs.includes(c.zone) && !mine.includes(c.id)).map(c => c.id);
  }
  const fallbackZone = (G, p) => G.chars[ownAlive(G, p)[0]].zone;
  const canMonitor = (G, p) => ownZones(G, p).includes(CONTROL);
  const monitorTargets = (G, p) => G.chars.filter(c => c.alive && !G.players[p].ids.includes(c.id)).map(c => c.id);
  const accuseTargets = (G, p) => (G.players[p].tokens > 0 ? killTargets(G, p) : []);
  const opponents = (G, p) => G.players.filter(q => !q.out && q.id !== p);

  // ---------- 推理 ----------
  function learn(G, o, c, val) {
    const cur = G.know[o][c];
    if (cur !== null && cur !== -2) return;
    G.know[o][c] = val;
    if (val === -1) G.cand[o].forEach(s => s.delete(c));
    else if (val >= 0) G.cand[o].forEach((s, q) => { if (q !== val) s.delete(c); });
  }
  function evidence(G, q, zone) {
    G.players[q].exposedRound = G.round;
    const aliveIds = ownAlive(G, q).length;
    for (const o of G.players) {
      if (o.id === q) continue;
      const s = G.cand[o.id][q];
      for (const c of G.chars) {
        if (!c.alive) continue;
        if (c.zone === zone) G.w[o.id][q][c.id] += 3;
        else if (aliveIds === 1) s.delete(c.id);
      }
    }
  }
  function prob(G, o, q, c) {
    if (!G.chars[c].alive || o === q) return 0;
    const k = G.know[o][c];
    if (k === q) return 1;
    if (k !== null && k !== -2) return 0;
    const s = G.cand[o][q];
    if (!s.has(c)) return 0;
    let sum = 0, known = 0;
    for (const x of s) if (G.chars[x].alive && (G.know[o][x] === null || G.know[o][x] === -2)) sum += G.w[o][q][x];
    for (const x of G.players[q].ids) if (G.chars[x].alive && G.know[o][x] === q) known++;
    const remain = ownAlive(G, q).length - known;
    if (remain <= 0 || sum <= 0) return 0;
    return Math.min(1, (G.w[o][q][c] / sum) * remain);
  }
  // 给玩家看的“可能是谁”列表
  function suspects(G, o, q) {
    const out = [];
    for (const c of G.chars) { const pr = prob(G, o, q, c.id); if (pr > 0) out.push({ c: c.id, pr }); }
    return out.sort((a, b) => b.pr - a.pr);
  }

  // ---------- 动作 ----------
  function log(G, e) { e.round = G.round; G.log.push(e); return e; }
  function doMove(G, p, cid, zone, cause = 'move') {
    const from = G.chars[cid].zone;
    G.chars[cid].zone = zone;
    if (cause === 'fallback') evidence(G, p, zone);
    return log(G, { t: 'move', p, cid, from, zone, cause });
  }
  function death(G, cid) {
    const ch = G.chars[cid];
    ch.alive = false;
    G.players.forEach(o => learn(G, o.id, cid, ch.owner));
    let elim = -1;
    if (ch.owner >= 0) {
      const q = G.players[ch.owner];
      if (q.ids.every(c => !G.chars[c].alive)) { q.out = true; elim = q.id; }
    }
    return elim;
  }
  function doKill(G, p, cid) {
    const zone = G.chars[cid].zone;
    evidence(G, p, zone);
    const elim = death(G, cid);
    checkWin(G);
    return log(G, { t: 'kill', p, cid, zone, owner: G.chars[cid].owner, elim });
  }
  function doMonitor(G, p, cid) {
    evidence(G, p, CONTROL);
    const isP = G.chars[cid].owner >= 0;
    if (!isP) learn(G, p, cid, -1);
    else { if (G.know[p][cid] === null) G.know[p][cid] = -2; G.w[p].forEach(arr => (arr[cid] *= 4)); }
    return log(G, { t: 'monitor', p, cid, isPlayer: isP });
  }
  function doAccuse(G, p, cid, q) {
    const pl = G.players[p];
    pl.tokens--;
    const zone = G.chars[cid].zone;
    evidence(G, p, zone);
    const correct = G.chars[cid].owner === q;
    let elim = -1;
    if (correct) { elim = death(G, cid); checkWin(G); }
    else {
      pl.ids.forEach(c => G.chars[c].alive && learn(G, q, c, p));
      G.players.forEach(o => { if (o.id !== q && G.know[o.id][cid] !== q) G.cand[o.id][q].delete(cid); });
      G.cand[q][q]; // noop
      // 被指认者自己知道 cid 不是自己的；其他人知道 cid 不属于 q
    }
    return log(G, { t: 'accuse', p, cid, q, correct, zone, owner: correct ? q : null, elim });
  }
  function checkWin(G) {
    const a = alivePlayers(G);
    if (a.length <= 1) { G.over = true; G.winner = a.length ? a[0].id : null; }
  }
  function endTurn(G) {
    const events = [];
    G.turns++;
    const n = G.players.length;
    let i = G.cur, wrapped = false;
    do { i = (i + 1) % n; if (i === G.start) wrapped = true; } while (G.players[i].out);
    G.cur = i;
    if (wrapped) {
      G.round++;
      const ghosts = G.players.filter(p => p.out);
      for (const g of ghosts) {
        const alive = G.chars.filter(c => c.alive);

      for (const p of ch.left) { const pr = p.presence || {}; if (status === 'lobby' && pr.cid && !ch.peers.some(x => x.presence && x.presence.cid === pr.cid)) peerMap.delete(pr.cid); }
      if (status === 'lobby') {
        const nj = [...peerMap.values()].filter(pr => pr.join && typeof pr.name === 'string').slice(0, 7).map(pr => ({ cid: pr.cid, name: pr.name.slice(0, 12) || '朋友' }));
        if (JSON.stringify(nj) !== JSON.stringify(joiners)) { joiners = nj; pushLobby(); }
      } else if (host) {
        seatsFinal.forEach((s, i) => {
          if (s.kind !== 'remote') return;
          const pr = peerMap.get(s.cid);
          if (!pr || !pr.pk || typeof pr.pk.x !== 'string') return;
          if (!s.pk || s.pk.x !== pr.pk.x) { s.pk = pr.pk; host.resendPriv(i); }
          if (pr.ready) host.setReady(i);
          if (pr.i && pr.i.n) host.receive(i, pr.i);
        });
      }
    });
    pushLobby();
    return {
      code,
      setSettings(s) { Object.assign(settings, s); pushLobby(); },
      get joiners() { return joiners; },
      start({ onState, onPriv, pace }) {
        const humans = [{ kind: 'local', name, cid }, ...joiners.map(j => ({ kind: 'remote', name: j.name, cid: j.cid, pk: (peerMap.get(j.cid) || {}).pk }))];
        const total = Math.max(settings.total, humans.length, 2);
        seatsFinal = [...humans, ...Array.from({ length: total - humans.length }, () => ({ kind: 'ai' }))];
        status = 'playing'; pushLobby();
        const stateRef = writer(C.db.doc(`rooms/${code}/live/state`));
        const privW = {};
        host = createHost({
          seats: seatsFinal, difficulty: settings.diff, pace,
          publish: st => { onState(st); stateRef(st); },
          sendPriv: async (i, pv) => {
            if (i === 0) return onPriv(pv);
            const s = seatsFinal[i];
            if (!s.pk) return;
            try { const box = await seal(s.pk, pv); (privW[i] = privW[i] || writer(C.db.doc(`rooms/${code}/priv/s${i}`)))({ hp: keys.pub, to: s.pk.x, ...box }); } catch (e) { console.warn('seal', e); }
          },
        });
        host.run().then(() => { status = 'done'; pushLobby(); });
        client = { seat: 0, send: it => host.receive(0, it), ready: () => host.setReady(0), stop: () => { host.stop(); status = 'done'; pushLobby(); rm.leave(); }, online: true, code };
        return client;
      },
      close() { status = 'done'; pushLobby(); rm.leave(); },
    };
  }

  // 朋友：列出房间
  async function listRooms() {
    const C = await caps();
    const snap = await C.db.collection('rooms').where('status', 'in', ['lobby', 'playing']).get();
    const cid = clientId();
    return snap.docs.map(d => d.data()).filter(r => r && Date.now() - (r.created || 0) < 6 * 3600e3).map(r => ({ ...r, mine: Array.isArray(r.seats) && r.seats.some(s => s.cid === cid) }));
  }
  // 朋友：加入房间，收状态，发操作
  async function joinRoom({ code, name, onLobby, onStart }) {
    const C = await caps();
    const cid = clientId();
    const keys = await myKeys();
    const rm = await C.room.join('mp-' + code);
    let pres = { g: code, cid, name, join: true, pk: keys.pub, ready: false, i: null };
    rm.presence(pres);
    let seat = -1, started = false;
    const unsubs = [];
    const client = {
      seat: -1, online: true, code,
      send: it => rm.presence({ i: it }),
      ready: () => rm.presence({ ready: true }),
      stop: () => { unsubs.forEach(u => u()); rm.leave(); },
    };
    unsubs.push(C.db.doc('rooms/' + code).onSnapshot(s => {
      const lobby = s.data();
      if (!lobby) return;
      onLobby && onLobby(lobby);
      if (lobby.status !== 'lobby' && !started) {
        seat = (lobby.seats || []).findIndex(x => x.cid === cid);
        if (seat < 0) return;
        started = true; client.seat = seat;
        onStart(client, (onState, onPriv) => {
          unsubs.push(C.db.doc(`rooms/${code}/live/state`).onSnapshot(s2 => { const d = s2.data(); if (d) onState(d); }, () => {}));
          unsubs.push(C.db.doc(`rooms/${code}/priv/s${seat}`).onSnapshot(async s3 => {
            const d = s3.data(); if (!d || d.to !== keys.pub.x) return;
            try { onPriv(await open(d.hp, d)); } catch (e) { console.warn('open', e); }
          }, () => {}));
        });
      }
    }, () => {}));
    return client;
  }

  // ---------- 独立服务器模式（Zeabur）：WebSocket ----------
  const isServer = () => typeof window !== 'undefined' && !!window.MP_SERVER;
  let sock = null;
  function wsConn() {
    if (sock) return sock;
    const handlers = new Set(), queue = [];
    let ws = null, open = false, backoff = 500, name = '';
    const connect = () => {
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
      ws.onopen = () => { open = true; backoff = 500; ws.send(JSON.stringify({ t: 'hello', cid: clientId(), name })); while (queue.length) ws.send(queue.shift()); handlers.forEach(f => f({ t: 'open' })); };
      ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } handlers.forEach(f => f(m)); };
      ws.onclose = () => { open = false; handlers.forEach(f => f({ t: 'closed' })); setTimeout(connect, backoff); backoff = Math.min(backoff * 2, 8000); };
    };
    connect();
    sock = {
      send(m) { const s = JSON.stringify(m); if (open) ws.send(s); else queue.push(s); },
      on(f) { handlers.add(f); return () => handlers.delete(f); },
      setName(n) { name = n; },
    };
    return sock;
  }
  function wsWatch(code, { onLobby, onStart }) {
    const S = wsConn();
    let started = false, stateCb = null, privCb = null, lastSt = null, lastPv = null;
    const client = {
      seat: -1, online: true, code, server: true,
      send: it => S.send({ t: 'intent', it }), ready: () => S.send({ t: 'ready' }),
      stop: () => { off(); S.send({ t: 'leave' }); },
    };
    const off = S.on(m => {
      if (m.t === 'lobby' && m.lobby.code === code) {
        onLobby && onLobby(m.lobby);
        if (m.lobby.status !== 'lobby' && !started) {
          const seat = (m.lobby.seats || []).findIndex(x => x.cid === clientId());
          if (seat < 0) return;
          started = true; client.seat = seat;
          onStart(client, (os, op) => { stateCb = os; privCb = op; if (lastSt) os(lastSt); if (lastPv) op(lastPv); });
        }
      } else if (m.t === 'state') { lastSt = m.st; stateCb && stateCb(m.st); }
      else if (m.t === 'priv') { lastPv = m.p; privCb && privCb(m.p); }
    });
    return client;
  }
  async function wsHostRoom({ name, onLobby }) {
    const S = wsConn(); S.setName(name);
    const code = await new Promise((res, rej) => {
      const off = S.on(m => { if (m.t === 'lobby' && m.lobby.status === 'lobby' && m.lobby.seats[0] && m.lobby.seats[0].cid === clientId()) { off(); res(m.lobby.code); } });
      S.send({ t: 'create', name });
      setTimeout(() => { off(); rej(new Error('timeout')); }, 10000);
    });
    let pend = null, client = null;
    const watch = wsWatch(code, { onLobby, onStart: (c, sub) => { client = c; if (pend) sub(pend.onState, pend.onPriv); else pend = { sub }; } });
    return {
      code,
      setSettings(s) { S.send({ t: 'settings', total: s.total, diff: s.diff }); },
      start({ onState, onPriv }) {
        if (pend && pend.sub) pend.sub(onState, onPriv); else pend = { onState, onPriv };
        S.send({ t: 'start' });
        return { seat: 0, online: true, code, server: true, send: it => S.send({ t: 'intent', it }), ready: () => S.send({ t: 'ready' }), stop: () => watch.stop() };
      },
      close() { watch.stop(); },
    };
  }
  function wsListRooms() {
    const S = wsConn();
    return new Promise((res, rej) => {
      const rid = Math.random().toString(36).slice(2);
      const off = S.on(m => { if (m.t === 'rooms' && m.rid === rid) { off(); res(m.rooms); } });
      S.send({ t: 'list', rid });
      setTimeout(() => { off(); rej(new Error('timeout')); }, 10000);
    });
  }
  async function wsJoinRoom({ code, name, onLobby, onStart, onError }) {
    const S = wsConn(); S.setName(name);
    const offErr = S.on(m => { if (m.t === 'error') onError && onError(m.msg); });
    const c = wsWatch(code, { onLobby, onStart });
    const stop = c.stop; c.stop = () => { offErr(); stop(); };
    S.send({ t: 'join', code, name });
    return c;
  }

  return {
    caps, local, clientId, P_COLORS, isServer, createHostForServer: createHost,
    hostRoom: o => (isServer() ? wsHostRoom(o) : hostRoom(o)),
    listRooms: () => (isServer() ? wsListRooms() : listRooms()),
    joinRoom: o => (isServer() ? wsJoinRoom(o) : joinRoom(o)),
  };
})();

    flow.addEventListener('mouseleave', hide);

    document.addEventListener('pointerdown', e => { if (cur && !flow.contains(e.target)) hide(); });
  }

  // ---------- 单人设置 ----------
  function soundChips() {
    return `<div class="field"><label>声音与画面</label><div class="chips"><button class="chip" id="snd" aria-pressed="${SFX.on}">音效 ${SFX.on ? '开' : '关'}</button><button class="chip" id="mus" aria-pressed="${Music.on}">背景音乐 ${Music.on ? '开' : '关'}</button><button class="chip" id="mot" aria-pressed="${motionOn()}">动态效果 ${motionOn() ? '开' : '关'}</button></div></div>`;
  }
  function wireSound(s) {
    s.querySelector('#snd').onclick = e => { const on = SFX.toggle(); e.target.textContent = `音效 ${on ? '开' : '关'}`; e.target.setAttribute('aria-pressed', on); sfx('uiClick'); };
    s.querySelector('#mus').onclick = e => { const on = Music.toggle(); e.target.textContent = `背景音乐 ${on ? '开' : '关'}`; e.target.setAttribute('aria-pressed', on); sfx('uiClick'); };
    s.querySelector('#mot').onclick = e => { settings.motion = !motionOn(); saveSettings(); applyMotion(); e.target.textContent = `动态效果 ${motionOn() ? '开' : '关'}`; e.target.setAttribute('aria-pressed', motionOn()); sfx('uiClick'); };
  }
  function countChips(id, val, min = 2) { return `<div class="chips" id="${id}">${[2, 3, 4, 5, 6, 7, 8].map(n => `<button class="chip" aria-pressed="${n === val}" data-n="${n}" ${n < min ? 'disabled' : ''}>${n}</button>`).join('')}</div>`; }
  function diffChips(val) { return `<div class="chips" id="df">${[['easy', '新手'], ['normal', '普通'], ['hard', '老狐狸']].map(([k, l]) => `<button class="chip" aria-pressed="${k === val}" data-d="${k}">${l}</button>`).join('')}</div>`; }
  function wireChips(s, sel, attr, cb) { s.querySelectorAll(sel + ' .chip').forEach(b => (b.onclick = () => { if (b.disabled) return; sfx('uiClick'); s.querySelectorAll(sel + ' .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); cb(b.dataset[attr]); })); }
  function showSetup() { Scene.setMode('full');

    const joinCode = () => { const c = (card.querySelector('#code').value || '').trim().toUpperCase(); if (!/^[A-Z]{4}$/.test(c)) { sfx('uiDisabled'); toast('房号是 4 个英文字母。', 'var(--danger)'); return; } if (!nick()) return; sfx('uiClick'); guestLobby(c); };

  async function hostLobby() {
    beginSession(true);
    const my = session;
    const total = Math.max(2, settings.players || 4);
    app.innerHTML = '';
    const s = h(`<section class="screen" id="setup"><div class="setup-card">
      <div><div class="eyebrow">房间已开</div><h1 class="h-title" style="margin:6px 0 0;font-size:26px">房号 <span id="code" style="color:var(--gold-hi);letter-spacing:.2em">····</span></h1></div>
      ${Net.isServer() ? `<div class="hint">把网址发给朋友，让他们点“和朋友联机”，输入房号加入。</div><div class="roomrow"><code style="min-width:0;overflow-wrap:anywhere">${esc(location.origin)}</code><button class="btn sm" id="copy">复制邀请</button></div>` : '<div class="hint">让朋友打开这个游戏 → 点“和朋友联机” → 加入你的房间。朋友需要先被你用邮箱邀请（右上角分享菜单）。</div>'}
      <div class="field"><label>已加入</label><div id="members" class="roomlist"></div></div>
      <div class="field"><label>总人数（不够的位置由 AI 补上）</label>${countChips('np', total)}<div class="hint" id="fill"></div></div>
      <div class="field"><label>AI 难度</label>${diffChips(settings.diff)}</div>
      <div class="setup-actions"><button class="btn ghost" id="back">解散房间</button><button class="btn primary" id="start">开始游戏</button></div>
    </div></section>`);
    app.append(s);
    let room;
    let cur = { total, diff: settings.diff };
    const draw = lobby => {
      if (my !== session) return;
      const seats = lobby.seats || [];
      s.querySelector('#code').textContent = lobby.code;
      s.querySelector('#members').innerHTML = seats.map((x, i) => `<div class="roomrow"><div><i class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${Net.P_COLORS[i]}"></i> <b>${esc(x.name)}</b>${i === 0 ? ' <span class="hint">（你，房主）</span>' : ''}</div></div>`).join('') + (seats.length < 2 ? '<div class="hint">等朋友加入……</div>' : '');
      const min = seats.length;
      s.querySelectorAll('#np .chip').forEach(b => { b.disabled = +b.dataset.n < Math.max(2, min); });
      if (cur.total < min) { cur.total = min; s.querySelectorAll('#np .chip').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === cur.total)); room && room.setSettings(cur); }
      s.querySelector('#fill').textContent = `${min} 位真人 + ${Math.max(0, cur.total - min)} 个 AI` + (cur.total <= 3 ? ' · 人少，每人 2 个身份' : '');
    };
    room = await Net.hostRoom({ name: settings.name, onLobby: draw });
    if (my !== session) { room.close(); return; }
    ui.room = room;
    room.setSettings(cur);
    const cp = s.querySelector('#copy');
    if (cp) cp.onclick = async () => { const txt = `来玩《暗夜派对》！打开 ${location.origin} → 和朋友联机 → 输入房号 ${room.code}`; try { await navigator.clipboard.writeText(txt); sfx('token'); toast('已复制邀请，发给朋友吧。'); } catch (e) { toast(txt); } };
    wireChips(s, '#np', 'n', v => { cur.total = +v; settings.players = cur.total; saveSettings(); room.setSettings(cur); });
    wireChips(s, '#df', 'd', v => { cur.diff = v; settings.diff = v; saveSettings(); room.setSettings(cur); });
    s.querySelector('#back').onclick = () => { sfx('uiCancel'); room.close(); ui.room = null; showTitle(); };
    s.querySelector('#start').onclick = () => {
      sfx('uiClick');
      conn = room.start({ pace: ms => (fast ? ms * 0.35 : ms), onState: st => my === session && onState(st), onPriv: p => my === session && onPriv(p) });
      ME = 0;
      app.innerHTML = '<section class="screen" style="display:grid;place-items:center"><div class="hint">发牌中……</div></section>';
    };
  }
  async function guestLobby(code) {
    beginSession(true);
    const my = session;
    app.innerHTML = '';
    const s = h(`<section class="screen" id="setup"><div class="setup-card">
      <div><div class="eyebrow">已加入</div><h1 class="h-title" style="margin:6px 0 0;font-size:26px">房号 <span style="color:var(--gold-hi);letter-spacing:.2em">${esc(code)}</span></h1></div>
      <div id="who" class="hint">正在进门……</div>
      <div class="field"><label>房间里的人</label><div id="members" class="roomlist"></div></div>
      <div class="hint" id="wait">等房主开始游戏。</div>
      <div class="setup-actions"><button class="btn ghost" id="back">离开</button></div>
    </div></section>`);
    app.append(s);
    let c;
    s.querySelector('#back').onclick = () => { sfx('uiCancel'); showOnline(); };
    c = await Net.joinRoom({
      code, name: settings.name,
      onError: msg => { if (my !== session) return; toast(msg, 'var(--danger)'); const w = s.querySelector('#wait'); if (w) w.textContent = msg; },
      onLobby: lobby => {
        if (my !== session || inGame) return;
        const seats = lobby.seats || [];
        const meIn = seats.some(x => x.cid === Net.clientId());
        s.querySelector('#who').textContent = `${lobby.host || '房主'} 的房间 · 共 ${lobby.total} 人（不够由 AI 补）`;
        s.querySelector('#members').innerHTML = seats.map((x, i) => `<div class="roomrow"><div><i class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${Net.P_COLORS[i]}"></i> <b>${esc(x.name)}</b>${x.cid === Net.clientId() ? ' <span class="hint">（你）</span>' : ''}</div></div>`).join('');
        s.querySelector('#wait').textContent = lobby.status === 'done' ? '这个房间已经结束了。' : lobby.status === 'playing' && !meIn ? '这局已经开始了，你没赶上。' : meIn ? '你已入座，等房主开始游戏。' : '正在入座……';
      },
      onStart: (client, subscribe) => {
        if (my !== session) return;
        conn = client; ME = client.seat;
        app.innerHTML = '<section class="screen" style="display:grid;place-items:center"><div class="hint">发牌中……</div></section>';
        subscribe(st => my === session && onState(st), p => my === session && onPriv(p));
      },
    });
    if (my !== session) { c.stop(); return; }
    conn = conn || c;
  }

  // ---------- 规则 ----------
  function showRules() {
    const fc = f => `<span class="facechip" style="background:${f === 'black' ? '#16121c' : `var(--z-${f})`};${f === 'yellow' ? 'color:#3a2a00' : ''}">${FACE[f].lb}</span>`;
    const pages = [
      ['目标', `<p>派对上有 20 位宾客。其中几位是玩家（你、朋友或 AI），每人秘密扮演一位宾客，其余都是 NPC。</p><p><b>当场上只剩你一个玩家活着，你就赢了。</b>NPC 活不活都无所谓，他们是你的掩护。</p><p>2–3 人局每人有 2 个身份，两个都死了才出局。</p>`],
      ['你的回合', `<p>二选一：<b>掷骰子</b>，或花 1 枚代币<b>揭穿</b>。</p><ul><li>${fc('red')} ${fc('blue')} ${fc('green')} ${fc('purple')} 把任意一个角色移进该颜色的房间</li><li>${fc('yellow')} 把一个角色移进控制室；如果你有角色在控制室，也可以改为<b>监控</b>：私下查出一个角色是玩家还是 NPC</li><li>${fc('black')} <b>杀人</b>：杀死和你同房间的一个人。房间里没别人时，改为拉一个人进来</li></ul>`],
      ['杀人会暴露你', `<ul><li>死者的身份卡会翻开：是 NPC，还是哪位玩家。</li><li>大家都知道这次是谁掷的骰子，所以会知道<b>你有角色在那个房间</b>。</li><li>杀人后可以<b>制造混乱</b>：从现场移走一个人，可以是你自己（逃跑），也可以是别人（转移视线）。别人分不清。</li></ul>`],
      ['揭穿', `<ul><li>每人只有 <b>${E.CONFIG.tokens} 枚</b>揭穿代币。</li><li>只能指认<b>和你同房间</b>的角色：“乌鸦，你就是厨师！”</li><li>猜对：那个角色当场死亡。</li><li>猜错：被你指认的玩家会看到你的真实身份。</li></ul>`],
      ['午夜与天亮', `<ul><li>第 ${E.CONFIG.midnightRound} 轮起进入<b>午夜</b>：骰子的黄色面也变成杀人。</li><li>出局的玩家变成<b>幽灵</b>，每轮结束时会把一位宾客拖到别的房间。</li><li>第 ${E.CONFIG.maxRound} 轮天亮，派对结束，平局。</li><li>右侧的推理笔记会根据公开信息帮你算出每个对手可能是谁。</li><li>联机时，轮到某人超过 90 秒没动作，会由 AI 代打一步。</li></ul>`],
    ];
    let i = 0;
    modal({
      title: '规则', wide: true, dismiss: 'x', buttons: [], mount: (m, close) => {
        const box = h(`<div class="rules"><div class="pg"></div><div class="dots">${pages.map(() => '<i></i>').join('')}</div><div class="btns"><button class="btn ghost" data-a="x">关闭</button><button class="btn" data-a="p">上一页</button><button class="btn primary" data-a="n">下一页</button></div></div>`);
        m.querySelector('.body').append(box);
        const draw = () => { box.querySelector('.pg').innerHTML = `<div class="eyebrow">${i + 1} / ${pages.length}</div><h3 class="h-title" style="margin:4px 0 10px;color:var(--gold-hi)">${pages[i][0]}</h3>${pages[i][1]}`; box.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i)); box.querySelector('[data-a=p]').disabled = i === 0; box.querySelector('[data-a=n]').textContent = i === pages.length - 1 ? '明白了' : '下一页'; };
        draw();
        box.onclick = e => { const a = e.target.dataset.a; if (!a) return; if (a === 'x') return close('x'); if (a === 'p') { i--; sfx('cardFlip'); draw(); } if (a === 'n') { if (i === pages.length - 1) return close('x'); i++; sfx('cardFlip'); draw(); } };
      },
    });
  }

  // ---------- 接收主机状态 ----------
  function beginSession(keepConn) {
    if (!keepConn) stopSession(); else { session++; document.querySelectorAll('.overlay').forEach(o => o.remove()); }
    G = null; priv = null; latest = null; endIds = null; lastSeq = -1; queue = []; playing = false; shownMsgs = new Set(); privQ = []; promptN = 0; drawn = false; inGame = false; resultShown = false; tags = {}; fast = false; catchup = false;
    Music.setMode('party');
  }
  function viewFromSnap(s) {
    const v = {
      round: s.round, cur: s.cur, start: s.start, per: s.per, over: s.over, winner: s.winner, pending: s.pending, stage: s.stage,
      chars: s.chars.map(([zone, alive, owner], i) => ({ id: i, name: E.CHARS[i][0], bio: E.CHARS[i][1], zone, alive: !!alive, owner })),
      players: s.players.map((p, i) => ({ id: i, name: p.name, color: p.color, tokens: p.tokens, out: p.out, n: p.n, dead: p.dead.slice(), ai: p.ai, ids: i === ME && priv ? priv.ids.slice() : p.dead.slice(), human: i === ME })),
      log: G ? G.log : [],
    };
    return v;
  }
  function onState(st) {
    if (!st || !st.snap) return;
    latest = st;
    if (!G) {
      G = viewFromSnap(st.snap);
      lastSeq = st.seq;
      G.log = st.events.slice();
      const endE = st.events.find(e => e.t === 'end'); if (endE) endIds = endE.ids;
      routeStage();
      return;
    }
    const fresh = st.events.filter(e => e.seq > lastSeq && !queue.some(q => q.seq === e.seq));
    if (fresh.length && fresh[0].seq > lastSeq + 1 + queue.length) { // 掉了太多：直接对齐
      queue = []; lastSeq = st.seq; const log = G.log; G = viewFromSnap(st.snap); G.log = log.concat(fresh);
      if (inGame) { placeTokens(); render(); }
      routeStage(); return;
    }
    queue.push(...fresh);
    routeStage();
    pump();
  }
  function onPriv(p) {
    priv = p;
    if (G) { G.players[ME].ids = p.ids.slice(); }
    for (const m of p.msgs || []) { const k = m.seq + m.t + m.cid; if (!shownMsgs.has(k)) { shownMsgs.add(k); privQ.push(m); } }
    if (!G) return;
    routeStage();
    if (inGame) { render(); pump(); }
  }
  function routeStage() {
    if (!G || !priv) return;
    const stage = latest.snap.stage;
    if (stage === 'draw' && !drawn && !inGame) { if (!document.getElementById('draw')) showDraw(); return; }
    if ((stage === 'play' || stage === 'end' || drawn) && !inGame && (stage !== 'draw')) { startGameScreen(); }
  }
  function reconcile() {
    if (!latest) return;
    const log = G.log;
    G = viewFromSnap(latest.snap);
    G.log = log;
  }
  async function pump() {
    if (playing || !inGame) return;
    playing = true;
    const my = session;
    try {
      for (;;) {
        if (my !== session) return;
        if (queue.length) {
          catchup = queue.length > 4;
          const e = queue.shift();
          applyEvent(e); G.log.push(e); lastSeq = e.seq;
          await play(e);
          if (my !== session) return;
          await drainPriv();
          continue;
        }
        catchup = false;
        await drainPriv();
        break;
      }
      reconcile(); placeTokens(); render();
      if (endIds && latest && latest.snap.stage === 'end') { await sleep(600); if (my === session) showResult(); return; }
      maybePrompt();
    } finally { if (my === session) playing = false; }
  }
  async function drainPriv() {
    while (privQ.length && privQ[0].seq <= lastSeq) {
      const m = privQ.shift();
      if (m.t === 'mon') {
        await reveal({ cid: m.cid, stamp: m.isPlayer ? '玩家' : 'NPC', kind: m.isPlayer ? 'player' : 'npc', sound: m.isPlayer ? 'revealPlayer' : 'revealNpc', caption: m.isPlayer ? `监控画面显示：<b>${G.chars[m.cid].name}</b> 是<b style="color:var(--danger)">某位玩家</b>。已记进你的笔记。` : `<b>${G.chars[m.cid].name}</b> 只是 NPC。已记进你的笔记。` });
      } else if (m.t === 'leak') {
        sfx('secretLeak');
        await modal({ title: '有人冤枉了你', body: `${pn(m.from)} 指认你是 ${G.chars[m.cid].name}，猜错了。<br>作为代价，你看到了 ${pn(m.from)} 的真实身份：`, buttons: [{ label: '记住了', value: 1, kind: 'primary' }], mount: md => { const row = h(`<div class="idhand" style="justify-content:center;margin-top:12px">${m.ids.map(c => `<div class="flip" style="width:110px;height:154px"><div class="inner"><div class="face back">${Art.cardBack()}</div>${idFront(c)}</div></div>`).join('')}</div>`); md.querySelector('.body').append(row); setTimeout(() => { row.querySelectorAll('.flip').forEach(f => f.classList.add('flipped')); sfx('cardFlip'); setTimeout(() => sfx('revealPlayer'), 500); }, 400); } });
      }
      render();
    }
  }
  function applyEvent(e) {
    const kill = (cid, owner, elim) => { const c = G.chars[cid]; c.alive = false; c.owner = owner; if (owner >= 0) { const p = G.players[owner]; if (!p.dead.includes(cid)) p.dead.push(cid); if (owner !== ME && !p.ids.includes(cid)) p.ids.push(cid); } if (elim >= 0) G.players[elim].out = true; };
    switch (e.t) {
      case 'turn': G.cur = e.p; G.pending = null; break;
      case 'move': G.chars[e.cid].zone = e.zone; break;
      case 'kill': kill(e.cid, e.owner, e.elim); break;
      case 'accuse': G.players[e.p].tokens--; if (e.correct) kill(e.cid, e.owner, e.elim); break;
      case 'round': G.round = e.round; break;
      case 'end': G.over = true; G.winner = e.w; endIds = e.ids; break;
    }
  }

  // ---------- 抽身份 ----------
  function showDraw() { Scene.setMode('full');
    const need = priv.ids.length;
    let k = 0;
    app.innerHTML = '';
    const s = h(`<section class="screen" id="draw"><div class="eyebrow">抽取身份${conn && conn.online ? ' · 联机' : ''}</div><h1 class="h-title" style="margin:0;font-size:26px">${need === 2 ? '抽两张宾客卡' : '抽一张宾客卡'}</h1>
      <p class="hint" style="margin:0;max-width:44ch">抽到谁，今晚你就是谁。只有你自己知道，其他人只看得到一位普通宾客。</p>
      <div class="deck shuffling">${Array.from({ length: 20 }, (_, i) => `<button class="dcard" aria-label="第 ${i + 1} 张卡" style="--sx:${(Math.random() * 120 - 60) | 0}px;--sy:${(Math.random() * 60 - 30) | 0}px;--sr:${(Math.random() * 40 - 20) | 0}deg">${Art.cardBack()}</button>`).join('')}</div>
      <button class="btn ghost" id="cancel">退出</button></section>`);
    app.append(s);
    sfx('cardShuffle');
    setTimeout(() => s.querySelector('.deck').classList.remove('shuffling'), 600);
    s.querySelector('#cancel').onclick = () => { sfx('uiCancel'); showTitle(); };
    s.querySelectorAll('.dcard').forEach(b => (b.onclick = async () => {
      if (k >= need) return;
      sfx('selectPick'); b.classList.add('taken');
      const c = priv.ids[k++];
      await reveal({ cid: c, stamp: '你', kind: 'player', sound: 'revealPlayer', caption: `今晚你是 <b>${E.CHARS[c][0]}</b>。${E.CHARS[c][1]}<br><span class="hint">它在棋盘上会有一圈金边，只有你看得到。</span>` });
      if (k >= need) {
        s.querySelectorAll('.dcard').forEach(x => (x.disabled = true));
        const go = h('<button class="btn primary" style="padding:14px 30px;font-size:16px">走进派对大厅</button>');
        s.querySelector('#cancel').replaceWith(go); go.focus();
        go.onclick = async () => {
          sfx('uiClick');
          go.disabled = true;
          let ob = null; try { ob = localStorage.getItem('mp_onboarded'); } catch (e) { ob = '1'; }
          if (!ob) await onboarding();
          drawn = true;
          conn && conn.ready();
          if (latest.snap.stage === 'draw') { go.textContent = '等其他玩家抽完身份……'; }
          routeStage();
        };
      } else toast('再抽一张：你还有第二个身份。');
    }));
  }
  async function onboarding() {
    const steps = [
      ['欢迎来到派对', '右边是<b>你的身份卡</b>，鼠标移上去才会翻开，免得被别人瞄到。棋盘上带金边的就是你。'],
      ['怎么行动', '轮到你时，在下方<b>掷骰子</b>，或者花代币<b>揭穿</b>。弹出提示后，在房间里点选角色。'],
      ['怎么推理', '点任意一位宾客可以查看档案、贴嫌疑标签。右侧的<b>推理笔记</b>会根据公开信息，算出每个对手可能是谁。'],
    ];
    for (let i = 0; i < steps.length; i++) await modal({ title: `${steps[i][0]}　<span class="hint">${i + 1}/3</span>`, body: steps[i][1], buttons: [{ label: i < 2 ? '下一步' : '好', value: 1, kind: 'primary' }] });
    try { localStorage.setItem('mp_onboarded', '1'); } catch (e) {}
  }

  // ---------- 游戏主界面 ----------
  function startGameScreen() {
    Scene.setMode('dim');
    inGame = true;
    app.innerHTML = '';
    const online = conn && conn.online;
    const s = h(`<section class="screen" id="game">
      <div class="topbar"><div class="brand">Midnight Party</div>${online ? `<span class="clock" title="联机房号">房号 ${esc(conn.code || '')}</span>` : ''}
        <div class="clock" id="clock"></div>
        <button class="iconbtn" id="b-log">日志</button><button class="iconbtn" id="b-rules">规则</button>
        <button class="iconbtn" id="b-snd" aria-pressed="${SFX.on}">音效 ${SFX.on ? '开' : '关'}</button><button class="iconbtn" id="b-mus" aria-pressed="${Music.on}">音乐 ${Music.on ? '开' : '关'}</button>
        <button class="iconbtn" id="b-fast" aria-pressed="false">快进</button>
        <button class="iconbtn" id="b-exit">退出</button></div>
      <aside class="left"><div class="panel"><h3>宾客名单 <span class="hint" style="letter-spacing:0">玩家</span></h3><div class="plist" id="plist"></div></div></aside>
      <main class="board-wrap"><div id="prompt"></div><div class="board" id="board">${Z.map((z, i) => `<div class="zone z${i}" data-z="${i}">${GLYPH[i]}<div class="zh"><i class="sw"></i><b>${z.c}·${z.n}</b><span>${i === 4 ? '可监控' : '房间'}</span><span class="cnt"></span></div><div class="toks"></div></div>`).join('')}</div>
        <div class="actionbar" id="actions"></div></main>
      <aside class="right"><div class="panel"><h3>我的身份 <span class="hint" style="letter-spacing:0">悬停查看</span></h3><div class="idhand" id="hand"></div></div>
        <div class="panel"><h3>推理笔记</h3><div class="hint" style="margin-bottom:4px">根据公开信息推算每个对手可能是谁</div><div id="notes"></div></div></aside>
    </section>`);

    ui.board = s.querySelector('#board');

    G.chars.forEach(c => {
      const b = h(`<button class="tok" data-c="${c.id}" aria-label="${c.name}"><div class="ring">${Art.portrait(c.id)}</div><div class="lb">${c.name}</div></button>`);

    });
    s.querySelector('#b-log').onclick = () => { sfx('uiClick'); showLog(); };
    s.querySelector('#b-rules').onclick = () => { sfx('uiClick'); showRules(); };
    s.querySelector('#b-snd').onclick = e => { const on = SFX.toggle(); e.currentTarget.textContent = `音效 ${on ? '开' : '关'}`; e.currentTarget.setAttribute('aria-pressed', on); sfx('uiClick'); };
    s.querySelector('#b-mus').onclick = e => { const on = Music.toggle(); e.currentTarget.textContent = `音乐 ${on ? '开' : '关'}`; e.currentTarget.setAttribute('aria-pressed', on); sfx('uiClick'); };
    s.querySelector('#b-fast').onclick = e => { fast = !fast; e.currentTarget.setAttribute('aria-pressed', fast); sfx('uiClick'); };
    s.querySelector('#b-exit').onclick = async () => {
      sfx('uiClick');
      const hostOnline = online && !conn.server && ME === 0 && latest && latest.snap.stage !== 'end';
      const v = await modal({ title: '离开派对？', body: hostOnline ? '你是房主。你一离开，这局就会中断，朋友们也玩不下去了。' : '退出会结束你这一局。', dismiss: 'no', buttons: [{ label: '留下', value: 'no', kind: 'ghost' }, { label: '退出', value: 'yes', kind: 'danger' }] });
      if (v === 'yes') showTitle();
    };
    Music.setMode(isMid() ? 'midnight' : 'party'); Music.start();

  function placeTokens() {
    if (!ui.board || !ui.board.isConnected) return;
    const boxes = ui.board.querySelectorAll('.toks');
    const byZone = [[], [], [], [], []];
    [...G.chars].sort((a, b) => (b.alive - a.alive) || a.id - b.id).forEach(c => byZone[c.zone].push(c.id));
    byZone.forEach((ids, z) => ids.forEach(id => boxes[z].append(tokEls[id])));
    ui.board.querySelectorAll('.zone').forEach((el, z) => (el.querySelector('.cnt').textContent = `${G.chars.filter(c => c.alive && c.zone === z).length} 人`));
  }
  function flipPlace(focus) {
    const first = {};
    for (const id in tokEls) first[id] = tokEls[id].getBoundingClientRect();
    placeTokens();
    for (const id in tokEls) {
      const l = tokEls[id].getBoundingClientRect(), f = first[id];
      const dx = f.left - l.left, dy = f.top - l.top;
      if (!dx && !dy) continue;
      const isF = +id === focus;
      tokEls[id].animate(isF
        ? [{ transform: `translate(${dx}px,${dy}px)`, zIndex: 20 }, { transform: `translate(${dx / 2}px,${dy / 2 - 46}px) scale(1.3)`, zIndex: 20, offset: 0.5 }, { transform: 'none', zIndex: 20 }]
        : [{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }],
        { duration: sp(isF ? 700 : 380), easing: 'cubic-bezier(.3,.7,.3,1)' });
    }
  }
  const noteFor = q => (priv && priv.notes || []).find(n => n.q === q);
  function render() {
    if (!G || !document.getElementById('plist')) return;
    const ck = document.getElementById('clock');
    const mid = isMid();
    ck.className = 'clock' + (mid ? ' mid' : '');
    ck.innerHTML = `<b>第 ${G.round} 轮</b><span class="hint">${mid ? `午夜 · 黄色也杀人 · 第 ${dawnR()} 轮天亮` : `距午夜还有 ${midR() - G.round} 轮`}</span>`;
    document.getElementById('plist').innerHTML = G.players.map(p => {
      const sub = p.out ? '出局 · 幽灵' : G.per === 2 ? `身份 ${p.n - p.dead.length}/${p.n}` : p.id === ME ? '你' : p.ai ? 'AI · 身份未知' : '身份未知';
      return `<div class="pl ${G.cur === p.id && !G.over ? 'cur' : ''} ${p.out ? 'out' : ''}"><i class="dot" style="background:${p.color}"></i><div><div class="nm">${nm(p.id)}${p.ai && conn && conn.online ? ' <span class="hint">AI</span>' : ''}</div><div class="sub">${sub}</div></div><div class="coins" title="揭穿代币">${Array.from({ length: tokenMax() }, (_, i) => `<i class="coin ${i < p.tokens ? '' : 'used'}"></i>`).join('')}</div></div>`;
    }).join('');
    for (const c of G.chars) {
      const el = tokEls[c.id];
      if (!el) continue;
      el.classList.toggle('dead', !c.alive);
      el.classList.toggle('mine', mine(c.id));
      el.querySelectorAll('.you,.tag,.know').forEach(x => x.remove());
      if (mine(c.id)) el.prepend(h('<span class="you">你</span>'));
      if (tags[c.id] !== undefined && c.alive) el.append(h(`<span class="tag" style="background:${G.players[tags[c.id]].color}" title="你的标记"></span>`));
      const k = priv && priv.know ? priv.know[c.id] : null;
      if (c.alive && !mine(c.id)) {
        if (k === -1) el.append(h('<span class="know npc">NPC</span>'));
        else if (k === -2) el.append(h('<span class="know pl">玩家</span>'));
        else if (k !== null && k >= 0) el.append(h(`<span class="know pl" style="background:${G.players[k].color};color:#111">${nm(k)}</span>`));
      }
      el.setAttribute('aria-label', `${c.name}${c.alive ? '' : '（已死亡）'}`);
    }
    const hand = document.getElementById('hand');
    const ids = priv ? priv.ids : [];
    hand.innerHTML = ids.map(c => `<div class="flip ${G.chars[c].alive ? '' : 'flipped'}" data-c="${c}" tabindex="0" aria-label="我的身份"><div class="inner"><div class="face back">${Art.cardBack()}</div>${idFront(c, G.chars[c].alive ? '' : '已死', 'player')}</div></div>`).join('');
    hand.querySelectorAll('.flip').forEach(f => {
      const c = +f.dataset.c; if (!G.chars[c].alive) { f.querySelector('.stamp').classList.add('show'); return; }
      const show = v => { if (f.classList.contains('flipped') !== v) { f.classList.toggle('flipped', v); sfx('cardFlip'); } };
      f.onmouseenter = () => show(true); f.onmouseleave = () => show(false);
      f.onfocus = () => show(true); f.onblur = () => show(false);
      f.onclick = () => show(!f.classList.contains('flipped'));
    });
    const notes = document.getElementById('notes');
    notes.innerHTML = G.players.filter(q => q.id !== ME).map(q => {
      const dead = q.dead;
      let inner;
      if (q.out) inner = `<div class="hint">出局。曾是 ${dead.map(c => G.chars[c].name).join('、')}</div>`;
      else {
        const n = noteFor(q.id) || { sus: [], total: 0 };
        const sure = n.sus.filter(([, pct]) => pct >= 100);
        const left = q.n - dead.length;
        inner = (dead.length ? `<div class="hint">已死身份：${dead.map(c => G.chars[c].name).join('、')}</div>` : '') +
          (sure.length ? `<div style="color:var(--danger);font-weight:700">确定是：${sure.map(([c]) => G.chars[c].name).join('、')}</div>` : '') +
          (sure.length >= left ? '' : n.total > 9 && (n.sus[0] || [0, 0])[1] < 15 ? `<div class="hint">线索不足：可能是 ${n.total} 人中的任何一位。等他杀人、监控或揭穿时就会露出马脚。</div>` :
            `<div class="nb-sus">${n.sus.slice(0, 6).map(([c, pct]) => `<span class="sus ${pct > 40 ? 'hot' : ''}" data-c="${c}"><span class="mini">${Art.portrait(c)}</span>${G.chars[c].name}<i>${pct}%</i></span>`).join('')}${n.total > 6 ? `<span class="hint">等 ${n.total} 人</span>` : ''}</div>`);
      }
      return `<div class="nb-row"><div class="nb-head"><i class="dot" style="width:10px;height:10px;border-radius:50%;background:${q.color}"></i>${esc(q.name)}${q.out ? ' <span class="hint">（幽灵）</span>' : ''}</div>${inner}</div>`;
    }).join('');
    notes.querySelectorAll('.sus').forEach(s => (s.onclick = () => { sfx('uiClick'); charDetail(+s.dataset.c); }));
    if (!ui.prompting) setActions(G.players[ME].out && !G.over ? 'spectate' : 'wait');
  }

  // ---------- 行动栏 ----------
  function setActions(mode, extra = {}) {
    const bar = document.getElementById('actions');
    if (!bar || !G) return;
    const p = G.players[G.cur];
    if (mode === 'human') {
      const tgt = E.accuseTargets(G, ME);
      const why = G.players[ME].tokens <= 0 ? '揭穿代币已经用完' : !tgt.length ? '你的房间里没有别人可以指认' : '指认同房间的某人是某位玩家';
      bar.innerHTML = `<div class="status"><b>你的回合</b><span class="why">掷骰子，或者花 1 枚代币揭穿一个人</span></div>
        <button class="btn primary big" id="a-roll">${ICON_DIE} 掷骰子</button>
        <button class="btn big" id="a-acc" ${tgt.length ? '' : 'aria-disabled="true"'} style="${tgt.length ? '' : 'opacity:.4'}" title="${why}">揭穿 <span class="coins">${Array.from({ length: tokenMax() }, (_, i) => `<i class="coin ${i < G.players[ME].tokens ? '' : 'used'}"></i>`).join('')}</span></button>
        <div class="why" style="flex-basis:100%">${tgt.length ? '' : '揭穿不可用：' + why}</div>`;
      bar.querySelector('#a-roll').onclick = () => { sfx('uiClick'); extra.resolve('roll'); };
      bar.querySelector('#a-acc').onclick = () => { if (!tgt.length) { sfx('uiDisabled'); toast(`不能揭穿：${why}`, 'var(--danger)'); return; } sfx('uiClick'); extra.resolve('accuse'); };
      bar.querySelector('#a-roll').focus({ preventScroll: true });
    } else if (mode === 'busy') {
      bar.innerHTML = `<div class="status"><b>${extra.text || '……'}</b></div>`;
    } else if (mode === 'spectate') {
      bar.innerHTML = `<div class="status"><b>你已出局，正在观战</b><span class="why">你的幽灵仍在派对里游荡</span></div>`;
    } else {
      const pd = G.pending && G.pending.seat === G.cur ? PHASE_TXT[G.pending.phase] : '';
      bar.innerHTML = `<div class="status"><b>${p ? `${nm(p.id)} 的回合` : ''}</b><span class="why">${p && p.id !== ME ? pd || '……' : pd}</span></div>`;
    }
  }

  // ---------- 选择 ----------
  function selectChar({ eligible, prompt, cancel = false }) {
    return new Promise(res => {
      sfx('selectHighlight');
      ui.board.classList.add('selecting');
      eligible.forEach(c => tokEls[c].classList.add('eligible'));
      const pb = document.getElementById('prompt');
      pb.innerHTML = `<div class="promptbar"><span>${prompt}</span>${cancel ? '<button class="btn sm ghost" id="p-cancel">取消</button>' : ''}</div>`;
      setActions('busy', { text: '请在房间里点选一个角色' });
      const done = v => { selecting = null; ui.cancelSel = null; ui.board.classList.remove('selecting'); eligible.forEach(c => tokEls[c] && tokEls[c].classList.remove('eligible')); pb.innerHTML = ''; res(v); };
      selecting = c => { if (eligible.includes(c)) { sfx('selectPick'); done(c); } };
      ui.cancelSel = () => done(null);
      if (cancel) pb.querySelector('#p-cancel').onclick = () => { sfx('uiCancel'); done(null); };
      const first = tokEls[eligible[0]]; first && first.focus({ preventScroll: true });

  // ---------- 日志 ----------
  function describe(e) {

      case 'kill': return `🔪 ${pn(e.p)} 下手了：${cn(e.cid)} 死在 ${zn(e.zone)}，身份是 ${e.owner >= 0 ? '玩家 ' + pn(e.owner) : 'NPC'}`;

      case 'skip': return `${pn(e.p)} 没有可移动的人，跳过`;

  function showLog() {
    let only = false;
    const d = h(`<div class="overlay" style="place-items:stretch;padding:0;background:rgba(8,5,12,.5)"><div class="drawer" role="dialog" aria-label="行动日志"><div style="display:flex;justify-content:space-between;align-items:center"><h2 class="h-title" style="margin:0;font-size:18px;color:var(--gold-hi)">行动日志</h2><button class="btn sm ghost" id="lx">关闭</button></div><div class="chips"><button class="chip" aria-pressed="true" data-f="0">全部</button><button class="chip" aria-pressed="false" data-f="1">只看杀人与揭穿</button></div><div class="loglist"></div></div></div>`);
    const list = d.querySelector('.loglist');
    const draw = () => {
      let r = -1, html = '', round = 1;
      const rows = [];
      for (const e of G.log) { if (e.t === 'round') round = e.round; const t = describe(e); if (t && (!only || ['kill', 'accuse'].includes(e.t))) rows.push([round, e, t]); }
      for (const [rd, e, t] of rows.reverse()) { if (rd !== r) { r = rd; html += `<div class="rd">第 ${r} 轮</div>`; } html += `<div class="le ${e.t === 'kill' ? 'k' : ''}">${t}</div>`; }

  // ---------- 骰子 ----------
  const DFIN = { red: [0, 0], blue: [0, -90], green: [0, -180], purple: [0, 90], yellow: [-90, 0], black: [90, 0] };
  async function rollDice(face, who) {
    const mid = isMid();
    if (catchup) { toast(describe({ t: 'roll', p: who, face })); return; }
    const ov = h(`<div class="overlay dice-ov"><div class="dicebox"><div class="eyebrow">${nm(who)} 掷骰子</div><div class="scene"><div class="cube">${['red', 'blue', 'green', 'purple', 'yellow', 'black'].map(f => `<div class="fc f-${f}">${f === 'black' || (f === 'yellow' && mid) ? ICON.knife : f === 'yellow' ? ICON.eye : FACE[f].lb}</div>`).join('')}</div></div><div class="diceres"></div></div></div>`);
    document.body.append(ov);
    const cube = ov.querySelector('.cube');
    cube.style.transform = `rotateX(${(Math.random() * 360) | 0}deg) rotateY(${(Math.random() * 360) | 0}deg)`;
    cube.getBoundingClientRect();
    sfx('diceShake');
    await sleep(120);
    sfx('diceRoll');
    const [fx, fy] = DFIN[face];
    cube.style.transition = `transform ${sp(1200)}ms cubic-bezier(.15,.65,.25,1)`;
    cube.style.transform = `rotateX(${fx + 720}deg) rotateY(${fy + 1080}deg)`;
    await sleep(1200);

    ov.querySelector('.diceres').innerHTML = `<b style="color:${face === 'black' ? '#ff6a7a' : `var(--z-${face})`}">${FACE[face].name}</b><span>${face === 'yellow' && mid ? '午夜：黄色也是杀人' : FACE[face].txt}</span>`;
    await sleep(who === ME ? 900 : 700);
    ov.remove();
  }

  // ---------- 事件动画（所有人看到的公开内容） ----------
  async function play(e) {

      await sleep(260); sfx('kill'); sfx('scream');

      const isP = e.owner >= 0;
      if (!catchup || e.owner === ME) await reveal({
        cid: e.cid, stamp: !isP ? 'NPC' : e.owner === ME ? '是你' : esc(G.players[e.owner].name), kind: isP ? 'player' : 'npc', sound: isP ? 'revealPlayer' : 'revealNpc',
        caption: `${pn(e.p)} 掷出黑色。<br>${G.chars[e.cid].name} 死在 ${zn(e.zone)}。${isP ? (e.owner === ME ? '<br><b style="color:var(--danger)">那是你。</b>' : `<br>原来是玩家 ${pn(e.owner)}！`) : '<br>只是一位普通宾客。'}${e.p !== ME ? `<br><span class="hint">现在你知道：${nm(e.p)} 有角色在 ${Z[e.zone].c}·${Z[e.zone].n}。</span>` : ''}`,
        auto: e.owner === ME ? 0 : 2200,
      });
      await afterDeath(e.elim);
    } else if (e.t === 'monitor') {
      sfx('monitorScan'); flashZone(E.CONTROL);

    } else if (e.t === 'accuse') {

      await reveal({
        cid: e.cid, spotlight: true, delay: 1300, stamp: e.correct ? '揭穿！' : '错了', kind: e.correct ? 'right' : 'wrong', sound: e.correct ? 'accuseRight' : 'accuseWrong',
        caption: `${pn(e.p)} 指认 ${pn(e.q)} 就是 ${G.chars[e.cid].name}。<br>${e.correct ? `<b style="color:var(--ok)">猜对了！</b>${G.chars[e.cid].name} 当场倒下。` : `<b style="color:var(--danger)">猜错了。</b>${e.q === ME ? '' : `${nm(e.q)} 现在知道了 ${nm(e.p)} 的真实身份。`}`}`,
        auto: e.q === ME && e.correct ? 0 : 2200,
      });

      else if (e.p === ME) { sfx('secretLeak'); await modal({ title: '你的身份泄露了', body: `${pn(e.q)} 现在知道你是谁了。<br><span class="hint">小心：轮到 ${nm(e.q)} 时，他可能会来找你。</span>`, buttons: [{ label: '我会小心', value: 1, kind: 'primary' }] }); }

  function flashZone(z) { const el = ui.board && ui.board.querySelector(`.z${z}`); if (!el) return; el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), sp(900)); }
  async function afterDeath(elim) {

  // ---------- 轮到我：根据主机的提问收集操作 ----------
  function cancelPrompt() {
    ui.prompting = false;

    document.querySelectorAll('.overlay.is-prompt').forEach(o => o._close ? o._close(undefined) : o.remove());
  }
  function maybePrompt() {
    const pd = G && G.pending;
    if (ui.prompting && (!pd || pd.n !== ui.prompting)) cancelPrompt();
    if (!pd || pd.seat !== ME || G.over || playing && queue.length) return;
    if (pd.n === promptN) return;
    promptN = pd.n;
    ui.prompting = pd.n;
    humanPrompt(pd).catch(err => console.error(err)).finally(() => { if (ui.prompting === pd.n) ui.prompting = false; });
  }
  async function humanPrompt(pd) {
    const n = pd.n, my = session;
    const live = () => my === session && G.pending && G.pending.n === n && ui.prompting === n;
    const send = it => { if (!live()) return; conn.send({ n, ...it }); ui.prompting = false; setActions('busy', { text: '……' }); };
    const confirm = async (title, body, yes = '确认', kind = 'primary') => (await modal({ title, body, prompt: true, dismiss: 'no', buttons: [{ label: '换一个', value: 'no', kind: 'ghost' }, { label: yes, value: 'yes', kind }] })) === 'yes';
    if (pd.phase === 'act') {
      for (;;) {
        const choice = await new Promise(resolve => setActions('human', { resolve }));
        if (!live()) return;
        if (choice === 'roll') return send({ type: 'roll' });
        const t = E.accuseTargets(G, ME);
        const c = await selectChar({ eligible: t, prompt: '揭穿：选择你要指认的角色（必须和你同房间）', cancel: true });
        if (!live()) return;
        if (c === null) continue;
        const opp = E.opponents(G, ME);
        const q = await modal({
          title: `${G.chars[c].name} 是谁？`, body: '你认为这个角色是哪位玩家扮演的？', prompt: true, dismiss: 'x', buttons: [{ label: '取消', value: 'x', kind: 'ghost' }], mount: (m, close) => {
            const g = h(`<div class="playerpick">${opp.map(p => { const nt = noteFor(p.id); const pr = nt ? (nt.sus.find(([x]) => x === c) || [0, 0])[1] : 0; return `<button data-q="${p.id}"><i class="dot" style="width:12px;height:12px;border-radius:50%;background:${p.color}"></i><b>${esc(p.name)}</b><small>笔记推算 ${pr}%</small></button>`; }).join('')}</div>`);
            m.querySelector('.body').append(g);
            g.querySelectorAll('button').forEach(b => (b.onclick = () => { sfx('selectPick'); close(+b.dataset.q); }));
          },
        });
        if (!live()) return;
        if (q === 'x' || q === undefined) continue;
        if (!(await confirm('确认揭穿', `指认 ${pn(q)} 就是 ${cn(c)}？<br><span class="hint">消耗你的揭穿代币。猜错的话，${esc(G.players[q].name)} 会看到你的真实身份。</span>`, '揭穿！', 'danger'))) { if (!live()) return; continue; }
        return send({ type: 'accuse', cid: c, q });
      }
    }
    if (pd.phase === 'move' || pd.phase === 'fallback') {
      const el = E.movableTo(G, pd.z);
      if (pd.phase === 'fallback') toast('你的房间里没有别人。改为：拉一个人进你的房间。', 'var(--danger)');
      for (;;) {
        const c = await selectChar({ eligible: el, prompt: pd.phase === 'fallback' ? `没人可杀。选一个人拉进 ${zn(pd.z)}（别人会知道你在这里）` : `选择一个角色，移进 ${zn(pd.z)}` });
        if (!live() || c === null) return;
        if (pd.phase === 'fallback' || (await confirm('确认移动', `把 ${cn(c)} 移到 ${zn(pd.z)}？`))) return send({ cid: c });
        if (!live()) return;
      }
    }
    if (pd.phase === 'yellow') {
      const canM = E.canMonitor(G, ME);
      const v = await modal({
        title: '黄色：控制室', body: '选择一项：', prompt: true, mount: (m, close) => {
          const g = h(`<div class="optcards"><button class="optcard" data-v="move"><b>移动</b><span>把一个角色移进控制室</span></button><button class="optcard" data-v="mon" ${canM ? '' : 'disabled'}><b>监控</b><span>${canM ? '私下查出一个角色是玩家还是 NPC' : '你的角色不在控制室，不能监控'}</span></button></div>`);
          m.querySelector('.body').append(g);
          g.querySelectorAll('.optcard').forEach(b => (b.onclick = () => { if (b.disabled) return sfx('uiDisabled'); sfx('uiClick'); close(b.dataset.v); }));
        },
      });
      if (!live()) return;
      const el = v === 'mon' ? E.monitorTargets(G, ME) : E.movableTo(G, E.CONTROL);
      for (;;) {
        const c = await selectChar({ eligible: el, prompt: v === 'mon' ? '选择要监控的角色（结果只有你知道）' : `选择一个角色，移进 ${zn(E.CONTROL)}` });
        if (!live() || c === null) return;
        if (await confirm(v === 'mon' ? '确认监控' : '确认移动', v === 'mon' ? `调出 ${cn(c)} 的监控录像？` : `把 ${cn(c)} 移到 ${zn(E.CONTROL)}？`, v === 'mon' ? '监控' : '确认')) return send({ mode: v, cid: c });
        if (!live()) return;
      }
    }
    if (pd.phase === 'kill') {
      const t = E.killTargets(G, ME);
      for (;;) {
        const c = await selectChar({ eligible: t, prompt: '<span style="color:#ff8a96">选择你要杀死的人</span>' });
        if (!live() || c === null) return;
        if (await confirm('确认下手', `杀死 ${cn(c)}？<br><span class="hint">动手之后，所有人都会知道你有角色在 ${Z[G.chars[c].zone].c}·${Z[G.chars[c].zone].n}。</span>`, '动手', 'danger')) return send({ cid: c });
        if (!live()) return;
      }
    }
    if (pd.phase === 'chaos') {
      const inZone = G.chars.filter(x => x.alive && x.zone === pd.zone).map(x => x.id);
      if (!inZone.length) return send({ cid: null });
      const v = await modal({ title: '制造混乱？', body: '你可以从案发现场移走一个人：<br>· 移走<b>自己</b>，就是逃跑；<br>· 移走<b>别人</b>，就是转移视线。<br>别人分不清你是哪一种。', prompt: true, buttons: [{ label: '不动', value: 'no', kind: 'ghost' }, { label: '移走一个人', value: 'yes', kind: 'primary' }] });
      if (!live()) return;
      if (v !== 'yes') return send({ cid: null });
      const who = await selectChar({ eligible: inZone, prompt: '选择要离开现场的人', cancel: true });
      if (!live()) return;
      if (who === null) return send({ cid: null });
      const z = await pickZone('去哪里？', `${cn(who)} 要去：`, pd.zone);
      if (!live()) return;
      return send({ cid: who, zone: z });
    }
  }

      <p class="hint" style="margin:0">揭开所有假面：</p>
      <div class="result-grid">${G.players.map(p => (endIds[p.id] || []).map(c => `<div class="who ${p.id === w ? 'win' : ''}"><div class="crown" ${p.id === w ? '' : 'style="visibility:hidden"'}>👑</div>${flipCard(c, G.chars[c].alive ? '' : '已死', 'player')}<div><b style="color:${p.color}">${nm(p.id)}</b>${p.ai && online ? ' <span class="hint">AI</span>' : ''}</div></div>`).join('')).join('')}</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn ghost" id="r-log">查看日志</button><button class="btn" id="r-home">回到大厅</button><button class="btn primary" id="r-again">${online ? (ME === 0 ? '再开一个房间' : '回到联机大厅') : '再来一局'}</button></div></section>`);
    app.append(s);
    s.querySelectorAll('.flip').forEach((f, i) => setTimeout(() => { f.classList.add('flipped'); sfx('cardFlip'); const st = f.querySelector('.stamp'); st && setTimeout(() => st.classList.add('show'), 600); }, 700 + i * 450));
    s.querySelector('#r-again').onclick = () => { sfx('uiClick'); if (online) showOnline(); else showSetup(); };
    s.querySelector('#r-home').onclick = () => { sfx('uiClick'); showTitle(); };
    s.querySelector('#r-log').onclick = () => { sfx('uiClick'); showLog(); };
    if (iWon) confetti();
  }
  function confetti() {
    const cv = document.getElementById('confetti'); cv.hidden = false;
    const ctx = cv.getContext('2d'); cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#d9b56a', '#f3dca0', '#d04556', '#4a86d8', '#3fa070', '#9562d0', '#e6b43c'];
    const ps = Array.from({ length: 160 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.5, vx: Math.random() * 2 - 1, vy: 2 + Math.random() * 3, r: Math.random() * 6.28, vr: Math.random() * 0.2 - 0.1, c: cols[(Math.random() * cols.length) | 0], s: 5 + Math.random() * 6 }));
    let t = 0;
    (function f() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
      if (++t < 260) requestAnimationFrame(f); else { cv.hidden = true; }
    })();
  }

  window.__mp = { get G() { return G; }, get priv() { return priv; }, setFast: v => (fast = v) };
  Scene.mount();
  applyMotion();
  showTitle();
})();

</script>
</body></html>
